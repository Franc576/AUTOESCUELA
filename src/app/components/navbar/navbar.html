<nav class="navbar">
  <div class="nav-container">
    <a routerLink="/" class="logo-link">
      <div class="logo-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <circle cx="12" cy="12" r="2"/>
          <path d="M12 2v8"/>
          <path d="M12 14v8"/>
          <path d="m4.93 4.93 4.24 4.24"/>
          <path d="m14.83 14.83 4.24 4.24"/>
          <path d="m19.07 4.93-4.24 4.24"/>
          <path d="m9.17 14.83-4.24 4.24"/>
        </svg>
      </div>
      <span class="logo-text">AUTOESCUELA MATTHEW</span>
    </a>
    
    <div class="nav-menu">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">Inicio</a>
      <a routerLink="/permisos" routerLinkActive="active" class="nav-link">Permisos</a>
      <a routerLink="/conocenos" routerLinkActive="active" class="nav-link">Conócenos</a>
      <a routerLink="/blog" routerLinkActive="active" class="nav-link">Blog</a>
      <a routerLink="/reservas" routerLinkActive="active" class="nav-link">Reservas</a>
      <a routerLink="/test" routerLinkActive="active" class="nav-link">Test de Práctica</a>
    </div>

    <!-- ── Acciones de Sesión (dinámicas) ── -->
    <div class="nav-actions" (mouseenter)="checkSession()">
      @if (loggedInUser()) {
        <span class="user-welcome">¡Hola, <strong>{{ loggedInUser() }}</strong>! 👋</span>
        <button (click)="logout()" class="btn-logout" title="Cerrar sesión">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      } @else {
        <a routerLink="/login" routerLinkActive="active" class="btn-login-nav">
          Iniciar sesión
        </a>
        <a routerLink="/signup" routerLinkActive="active" class="btn-portal">
          <span>Crear cuenta</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <line x1="19" y1="8" x2="19" y2="14"/>
            <line x1="22" y1="11" x2="16" y2="11"/>
          </svg>
        </a>
      }
    </div>
  </div>
</nav>
